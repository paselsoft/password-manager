# Pubblica la web app (cartella webapp/) su GitHub Pages.
# Parte a ogni push sul branch "main" oppure a mano da Actions -> "Pubblica web app" -> Run workflow.
name: Pubblica web app

on:
  push:
    branches: [main]
    paths: ['webapp/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - run: node --test tests/web/core.test.mjs

  # Il caricamento e la pubblicazione stanno in due job separati: se sono nello
  # stesso job, deploy-pages a volte cerca il pacchetto prima che GitHub lo
  # registri ("No artifacts named github-pages", actions/deploy-pages#451).
  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v5
        with:
          path: webapp

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
